name: Bug report / 问题反馈
description: Report a reproducible build or runtime problem.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "For vulnerabilities, follow SECURITY.md. Remove secrets, private keys and APDU payloads."
  - type: textarea
    id: environment
    attributes:
      label: Environment / 环境
      description: Commit, OS, compiler, board, applet and TLS stack versions, as relevant.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce / 复现步骤
      description: Include a minimal configuration and the exact command or API sequence.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior / 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and logs / 实际结果与日志
      description: Include relevant error output with sensitive data removed.
    validations:
      required: true
