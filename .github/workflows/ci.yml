name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux GCC
            os: ubuntu-24.04
            cc: gcc
            cxx: g++
          - name: Linux Clang
            os: ubuntu-24.04
            cc: clang
            cxx: clang++
          - name: Windows MinGW
            os: windows-latest
            cc: gcc
            cxx: g++
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      PYTHONUTF8: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Select Windows MinGW
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $compilerDirectory = @('C:\msys64\mingw64\bin', 'C:\mingw64\bin') |
            Where-Object { (Test-Path "$_\gcc.exe") -and (Test-Path "$_\g++.exe") } |
            Select-Object -First 1
          if (-not $compilerDirectory) { throw 'MinGW-w64 GCC/G++ were not found' }
          $compilerDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install development tools
        run: python -m pip install -r requirements-dev.txt
      - name: Check project integrity
        run: python tools/check_project.py
      - name: Check C/C++ formatting
        run: python tools/format.py --check
      - name: Run session, crypto and polling mocks
        run: python tests/run.py
      - name: Check portable build and C++ linkage
        run: python tests/run_portable.py
      - name: Check source export and tools
        run: python -m unittest discover -s tests -p "test_tools.py"
